<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Vibrant Media Red Gradient -->
    <linearGradient id="ntBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E46"/>
      <stop offset="50%" stop-color="#E11438"/>
      <stop offset="100%" stop-color="#B90C28"/>
    </linearGradient>

    <!-- Upward Growth Arrow Gradient -->
    <linearGradient id="ntArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8EC"/>
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="ntShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#88091E" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base (Curved Studio Screen) -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#ntBgGrad)" filter="url(#ntShadow)"/>

  <!-- Top Glass Sheen (Subtle Modern Luster) -->
  <path d="M 8 36 C 8 20.5 20.5 8 36 8 L 84 8 C 99.5 8 112 20.5 112 36 C 112 50 82 56 60 56 C 38 56 8 50 8 36 Z" fill="#FFFFFF" fill-opacity="0.15"/>

  <!-- Media Play Triangle: Optical Center (X: 42 to 78, Y: 36 to 84) -->
  <!-- Left Base Wing of Play Button -->
  <path d="M 40 38 C 40 34.8 43.6 32.8 46.4 34.5 L 62 44 L 62 76 L 46.4 85.5 C 43.6 87.2 40 85.2 40 82 Z" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- Center Play Core merging with Arrow -->
  <polygon points="62,44 82,59.5 82,60.5 62,76" fill="#FFFFFF"/>

  <!-- Growth Dynamic Arrow: Ascends from lower-left through center to top-right -->
  <g>
    <!-- Growth Line Trajectory -->
    <path d="M 33 80 L 52 64 L 66 72 L 88 42" stroke="url(#ntArrowGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Arrowhead at Top Right Peak -->
    <path d="M 72 41 L 89 41 L 89 58" stroke="url(#ntArrowGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Growth Sparkle Star (Breakthrough Inspiration) -->
  <path d="M 94 22 Q 94 28 100 28 Q 94 28 94 34 Q 94 28 88 28 Q 94 28 94 22 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
