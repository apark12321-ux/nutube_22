<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Premium Crimson-Red NuTube Gradient -->
    <linearGradient id="nutubeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1F44"/>
      <stop offset="65%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Upward Growth Accent Glow -->
    <linearGradient id="growthGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#nutubeRed)" filter="url(#softShadow)"/>

  <!-- Subtle Top Specular Sheen -->
  <path d="M 6 28 C 6 15.85 15.85 6 28 6 L 72 6 C 84.15 6 94 15.85 94 28 C 94 38 68 46 50 46 C 32 46 6 38 6 28 Z" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Left Lower Play Wing (Starting Point) -->
  <path d="M 34 32 C 34 29.8 36.4 28.4 38.3 29.5 L 48 35.2 L 48 64.8 L 38.3 70.5 C 36.4 71.6 34 70.2 34 68 Z" fill="#FFFFFF" fill-opacity="0.88"/>

  <!-- Center-Right Media Play Triangle Merged with Ascending Growth Arrow -->
  <!-- Conveys Creation (Play Triangle) and Growth (Rising Trajectory Arrow) -->
  <path d="M 52 37.6 L 68 47.3 C 69.8 48.4 69.8 51.6 68 52.7 L 52 62.4 Z" fill="#FFFFFF"/>

  <!-- Dynamic Upward Growth Surge: Diagonal Arrow Shooting to the Top Right -->
  <path d="M 43 72 L 72 43 M 72 43 L 56 43 M 72 43 L 72 59" stroke="url(#growthGlow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mini Sparkle representing Fresh Creation (Top Right) -->
  <circle cx="76" cy="24" r="3.5" fill="#FFE4E6"/>
</svg>
